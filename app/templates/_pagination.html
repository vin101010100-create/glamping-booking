{% if pagination.pages > 1 %}
<nav class="mt-5" aria-label="Постраничная навигация">
    <ul class="pagination justify-content-center">
        <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
            <a class="page-link" href="?page={{ pagination.prev_num }}{% if pagination_qs %}&{{ pagination_qs }}{% endif %}">
                <i class="bi bi-chevron-left"></i>
            </a>
        </li>
        {% for page_number in pagination.iter_pages(left_edge=1, left_current=2, right_current=2, right_edge=1) %}
            {% if page_number %}
            <li class="page-item {% if page_number == pagination.page %}active{% endif %}">
                <a class="page-link" href="?page={{ page_number }}{% if pagination_qs %}&{{ pagination_qs }}{% endif %}">
                    {{ page_number }}
                </a>
            </li>
            {% else %}
            <li class="page-item disabled"><span class="page-link">…</span></li>
            {% endif %}
        {% endfor %}
        <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
            <a class="page-link" href="?page={{ pagination.next_num }}{% if pagination_qs %}&{{ pagination_qs }}{% endif %}">
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    </ul>
</nav>
{% endif %}
